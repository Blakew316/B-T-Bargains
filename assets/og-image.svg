<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27e"/>
      <stop offset="0.6" stop-color="#e9b86a"/>
      <stop offset="1" stop-color="#cf9f54"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="950" cy="150" r="80" fill="#fff2cf" opacity="0.95"/>
  <circle cx="950" cy="150" r="150" fill="#ffdd8c" opacity="0.35"/>

  <!-- hills -->
  <path d="M0 430 Q300 380 600 425 T1200 415 V630 H0 Z" fill="#7a8c4a"/>
  <path d="M0 480 Q350 445 700 485 T1200 470 V630 H0 Z" fill="#5c6b3a"/>

  <!-- barn -->
  <g transform="translate(150 300)">
    <path d="M0 60 100 15 200 60 V190 H0 Z" fill="#9b3322"/>
    <path d="M0 60 100 15 200 60 H0 Z" fill="#7a2618"/>
    <rect x="80" y="120" width="40" height="70" fill="#f6efe1"/>
    <path d="M100 60 60 80 v25 h80 V80 L100 60 Z" fill="#f6efe1" opacity=".9"/>
  </g>

  <!-- silo -->
  <g transform="translate(360 320)">
    <rect x="0" y="20" width="55" height="170" fill="#cdd2d6"/>
    <path d="M0 20 Q27 -15 55 20 Z" fill="#9aa0a6"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="120" font-family="Georgia, serif" font-size="78" font-weight="800" fill="#fffaf0">B&amp;T Bargains</text>
  <text x="84" y="170" font-family="Georgia, serif" font-size="30" fill="#fbf2df">The Bargain Barn · Loudon, Tennessee</text>
</svg>
